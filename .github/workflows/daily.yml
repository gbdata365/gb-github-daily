name: Daily GitHub Open Source
on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
permissions:
  contents: write
  actions: write   # 수집 후 Pages 배포 워크플로를 호출하기 위해 필요
concurrency:
  group: github-daily-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Fetch, rank and summarize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
        run: python scripts/collect.py
      - name: Commit archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: update daily GitHub repositories"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      # GITHUB_TOKEN 으로 한 push 는 다른 워크플로(pages.yml)를 깨우지 않으므로 배포를 직접 호출한다
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
